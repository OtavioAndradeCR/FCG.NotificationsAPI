# Compose APENAS para desenvolvimento local da Lambda de notificações.
# A infraestrutura completa (RabbitMQ, APIs, Forwarder) fica no repositório FCG.Infra.
services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: fcg-dynamodb-local
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb"]
