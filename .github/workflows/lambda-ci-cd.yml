name: Test, build and deploy Lambda

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  FUNCTION_NAME: FCG-NotificationsAPI
  PROJECT_PATH: src/FCG.NotificationsAPI/FCG.NotificationsAPI.csproj
  FUNCTION_HANDLER: FCG.NotificationsAPI::FCG.NotificationsAPI.Functions.NotificationsFunction::FunctionHandler
  DYNAMODB_TABLE: fcg-notification-users
  SQS_USER_QUEUE: fcg-user-created
  SQS_PAYMENT_QUEUE: fcg-payment-processed

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore Lambda project
        run: dotnet restore "$PROJECT_PATH"

      - name: Build Lambda project
        run: dotnet build "$PROJECT_PATH" --configuration Release --no-restore

      - name: Run automated tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TEST_PROJECTS < <(find . -type f \
            \( -iname '*Tests.csproj' -o -iname '*Test.csproj' \) \
            ! -path './tests/e2e-test/*' \
            ! -path './src/FCG.NotificationsAPI/*' | sort)

          if (( ${#TEST_PROJECTS[@]} == 0 )); then
            echo "::notice::Nenhum projeto de teste automatizado foi encontrado."
            echo "::notice::O projeto tests/e2e-test foi ignorado porque depende da infraestrutura completa."
          else
            echo "Foram encontrados ${#TEST_PROJECTS[@]} projetos de teste."

            for project in "${TEST_PROJECTS[@]}"; do
              dotnet test "$project" \
                --configuration Release \
                --logger "trx;LogFileName=$(basename "${project%.csproj}").trx" \
                --results-directory "${{ github.workspace }}/TestResults"
            done
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

      - name: Configure AWS Academy credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate AWS credentials
        run: aws sts get-caller-identity

      - name: Install Amazon Lambda Tools
        run: dotnet tool install --global Amazon.Lambda.Tools --version '6.*'

      - name: Package Lambda
        working-directory: src/FCG.NotificationsAPI
        run: |
          dotnet lambda package \
            --configuration Release \
            --framework net10.0 \
            --output-package "${{ runner.temp }}/lambda.zip"
          test -s "${{ runner.temp }}/lambda.zip"
          unzip -t "${{ runner.temp }}/lambda.zip"

      - name: Resolve AWS account and LabRole
        id: aws
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/LabRole"
          echo "account-id=${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"
          echo "role-arn=${ROLE_ARN}" >> "$GITHUB_OUTPUT"

      - name: Ensure DynamoDB table exists
        shell: bash
        run: |
          set -euo pipefail

          if aws dynamodb describe-table \
              --table-name "$DYNAMODB_TABLE" \
              --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "DynamoDB table already exists: $DYNAMODB_TABLE"
          else
            echo "Creating DynamoDB table: $DYNAMODB_TABLE"

            aws dynamodb create-table \
              --table-name "$DYNAMODB_TABLE" \
              --attribute-definitions AttributeName=Id,AttributeType=S \
              --key-schema AttributeName=Id,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$AWS_REGION"

            aws dynamodb wait table-exists \
              --table-name "$DYNAMODB_TABLE" \
              --region "$AWS_REGION"
          fi

      - name: Create or update Lambda function
        shell: bash
        env:
          ROLE_ARN: ${{ steps.aws.outputs.role-arn }}
        run: |
          set -euo pipefail
          ZIP="${{ runner.temp }}/lambda.zip"

          if aws lambda get-function \
              --function-name "$FUNCTION_NAME" \
              --region "$AWS_REGION" >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --zip-file "fileb://${ZIP}" \
              --region "$AWS_REGION"

            aws lambda wait function-updated \
              --function-name "$FUNCTION_NAME" \
              --region "$AWS_REGION"

            aws lambda update-function-configuration \
              --function-name "$FUNCTION_NAME" \
              --runtime dotnet10 \
              --handler "$FUNCTION_HANDLER" \
              --role "$ROLE_ARN" \
              --memory-size 512 \
              --timeout 30 \
              --environment "Variables={DynamoDB__TableName=${{env.DYNAMODB_TABLE}},Smtp__Host=smtp.gmail.com,Smtp__Port=587,Smtp__Username=${{ secrets.SMTP_USERNAME }},Smtp__Password=${{ secrets.SMTP_PASSWORD }},Smtp__SenderName=FIAP Cloud Games,Smtp__SenderEmail=${{ secrets.SMTP_SENDER_EMAIL }}}" \
              --region "$AWS_REGION"
          else
            aws lambda create-function \
              --function-name "$FUNCTION_NAME" \
              --runtime dotnet10 \
              --handler "$FUNCTION_HANDLER" \
              --role "$ROLE_ARN" \
              --zip-file "fileb://${ZIP}" \
              --memory-size 512 \
              --timeout 30 \
              --environment "Variables={DynamoDB__TableName=${{env.DYNAMODB_TABLE}},Smtp__Host=smtp.gmail.com,Smtp__Port=587,Smtp__Username=${{ secrets.SMTP_USERNAME }},Smtp__Password=${{ secrets.SMTP_PASSWORD }},Smtp__SenderName=FIAP Cloud Games,Smtp__SenderEmail=${{ secrets.SMTP_SENDER_EMAIL }}}" \
              --region "$AWS_REGION"
          fi

          aws lambda wait function-active-v2 \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION"
      
      - name: Ensure SQS queues exist
        shell: bash
        run: |
          set -euo pipefail

          ensure_queue() {
            local queue_name="$1"
            local queue_url=""
            local max_attempts=15
            local attempt=1

            echo "Verificando fila SQS: ${queue_name}"

            queue_url="$(aws sqs get-queue-url \
              --queue-name "$queue_name" \
              --region "$AWS_REGION" \
              --query 'QueueUrl' \
              --output text 2>/dev/null || true)"

            if [[ -z "$queue_url" || "$queue_url" == "None" ]]; then
              echo "Fila não encontrada. Criando: ${queue_name}"

              queue_url="$(aws sqs create-queue \
                --queue-name "$queue_name" \
                --attributes \
                  VisibilityTimeout=60 \
                  MessageRetentionPeriod=345600 \
                  ReceiveMessageWaitTimeSeconds=10 \
                --region "$AWS_REGION" \
                --query 'QueueUrl' \
                --output text)"

              echo "Fila criada: ${queue_url}"
            else
              echo "Fila já existe: ${queue_url}"
            fi

            echo "Aguardando a fila ficar disponível..."

            while (( attempt <= max_attempts )); do
              if aws sqs get-queue-attributes \
                --queue-url "$queue_url" \
                --attribute-names QueueArn \
                --region "$AWS_REGION" \
                >/dev/null 2>&1; then
                echo "Fila disponível: ${queue_name}"
                break
              fi

              if (( attempt == max_attempts )); then
                echo "::error::A fila ${queue_name} não ficou disponível após ${max_attempts} tentativas."
                exit 1
              fi

              echo "Tentativa ${attempt}/${max_attempts}. Aguardando 2 segundos..."
              sleep 2
              ((attempt++))
            done

            # O SQS requer um pequeno intervalo após a criação antes do primeiro uso.
            sleep 2
          }

          ensure_queue "$SQS_USER_QUEUE"
          ensure_queue "$SQS_PAYMENT_QUEUE"
      - name: Create SQS triggers when missing
        shell: bash
        env:
          ACCOUNT_ID: ${{ steps.aws.outputs.account-id }}
        run: |
          set -euo pipefail

          ensure_mapping() {
            local queue_name="$1"
            local queue_url=""
            local queue_arn=""
            local mapping_uuid=""

            echo "Configurando trigger para a fila: ${queue_name}"

            queue_url="$(aws sqs get-queue-url \
              --queue-name "$queue_name" \
              --region "$AWS_REGION" \
              --query 'QueueUrl' \
              --output text)"

            queue_arn="$(aws sqs get-queue-attributes \
              --queue-url "$queue_url" \
              --attribute-names QueueArn \
              --region "$AWS_REGION" \
              --query 'Attributes.QueueArn' \
              --output text)"

            if [[ -z "$queue_arn" || "$queue_arn" == "None" ]]; then
              echo "::error::Não foi possível obter o ARN da fila ${queue_name}."
              exit 1
            fi

            echo "Queue URL: ${queue_url}"
            echo "Queue ARN: ${queue_arn}"

            mapping_uuid="$(aws lambda list-event-source-mappings \
              --function-name "$FUNCTION_NAME" \
              --event-source-arn "$queue_arn" \
              --region "$AWS_REGION" \
              --query 'EventSourceMappings[0].UUID' \
              --output text)"

            if [[ -z "$mapping_uuid" || "$mapping_uuid" == "None" ]]; then
              echo "Criando event source mapping..."

              aws lambda create-event-source-mapping \
                --function-name "$FUNCTION_NAME" \
                --event-source-arn "$queue_arn" \
                --batch-size 10 \
                --function-response-types ReportBatchItemFailures \
                --region "$AWS_REGION"
            else
              echo "Trigger já existe para ${queue_name}: ${mapping_uuid}"
            fi
          }

          ensure_mapping "$SQS_USER_QUEUE"
          ensure_mapping "$SQS_PAYMENT_QUEUE"

      - name: Verify deployment
        run: |
          set -euo pipefail
          aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION" \
            --query '{Name:FunctionName,Runtime:Runtime,Handler:Handler,Role:Role,State:State,LastUpdateStatus:LastUpdateStatus}'

          aws lambda list-event-source-mappings \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION" \
            --query 'EventSourceMappings[].{UUID:UUID,State:State,EventSourceArn:EventSourceArn}'
